<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta</title>


    <!-- FONTES -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <div class="screen">


        <!-- PARTE AZUL COM A LOGO -->

        <header class="hero">

            <img
                class="hero__logo"
                src="../src/logo.svg"
                alt="Logo"
            >

        </header>



        <!-- ÁREA BRANCA -->

        <main class="sheet">


            <!-- TÍTULO -->

            <h1 class="sheet__title">
                Criar conta
            </h1>


            <p class="sheet__subtitle">
                Preencha os dados abaixo para começar a explorar
            </p>



            <!-- FORMULÁRIO -->

            <form
                class="form"
                id="cadastroForm"
            >


                <!-- NOME -->

                <div class="field">

                    <label for="nome">
                        Nome completo
                    </label>


                    <div class="input-wrap">

                        <svg
                            class="icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >

                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            />

                            <path
                                d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                            />

                        </svg>


                        <input
                            id="nome"
                            type="text"
                            placeholder="Seu nome completo"
                            required
                        >

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        E-mail
                    </label>


                    <div class="input-wrap">

                        <svg
                            class="icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >

                            <rect
                                x="2"
                                y="4"
                                width="20"
                                height="16"
                                rx="2"
                            />

                            <path
                                d="m2 7 10 6 10-6"
                            />

                        </svg>


                        <input
                            id="email"
                            type="email"
                            placeholder="seuemail@exemplo.com"
                            required
                        >

                    </div>

                </div>



                <!-- SENHA -->

                <div class="field">

                    <label for="senha">
                        Senha
                    </label>


                    <div class="input-wrap">

                        <svg
                            class="icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />

                        </svg>


                        <input
                            id="senha"
                            type="password"
                            placeholder="Crie sua senha"
                            required
                        >

                    </div>

                </div>



                <!-- CONFIRMAR SENHA -->

                <div class="field">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>


                    <div class="input-wrap">

                        <svg
                            class="icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />

                        </svg>


                        <input
                            id="confirmarSenha"
                            type="password"
                            placeholder="Repita a senha"
                            required
                        >

                    </div>

                </div>



                <!-- TERMOS -->

                <label class="check">

                    <input
                        type="checkbox"
                        id="termos"
                        required
                    >


                    <span class="box"></span>


                    <span class="check__text">
                        Li e aceito os Termos de Uso e a Política de Privacidade
                    </span>

                </label>



                <!-- BOTÃO CADASTRAR -->

                <button
                    class="btn btn--primary"
                    type="submit"
                >
                    Cadastrar
                </button>



                <!-- DIVISOR -->

                <div class="divider">

                    <span>
                        ou cadastre-se com
                    </span>

                </div>



                <!-- GOOGLE E APPLE -->

                <div class="socials">


                    <button
                        class="btn btn--ghost"
                        type="button"
                    >

                        <img
                            src="../src/icons/google.svg"
                            alt=""
                            width="20"
                            height="20"
                        >

                        Google

                    </button>



                    <button
                        class="btn btn--ghost"
                        type="button"
                    >

                        <img
                            src="../src/icons/apple.svg"
                            alt=""
                            width="20"
                            height="20"
                        >

                        Apple

                    </button>


                </div>



                <!-- VOLTAR PARA LOGIN -->

                <div class="register-link">

                    <span>
                        Já tem uma conta?
                    </span>


                    <a href="index.html">
                        Entrar
                    </a>

                </div>


            </form>

        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
