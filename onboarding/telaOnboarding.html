<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Recife para viver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="pagina">


        <!-- Cabeçalho -->
        <header>

            <div class="logo">
                <img src="./logo.svg" alt="logo">
            </div>


            <button
                class="pular"
                type="button"
                onclick="pularPagina()">

                Pular

            </button>

        </header>


        <!-- Conteúdo principal -->

            <p class="subtitulo">
                RECIFE PARA VIVER
            </p>


            <h1>

                A cultura
                <br>

                começa onde
                <br>

                <span class="circulo">
                    você está.
                </span>

            </h1>


            <p class="descricao">

                Descubra lugares,
                <br>

                histórias e sabores que
                <br>

                fazem o Recife pulsar.

            </p>


            <!-- Controles do slide -->
            <div class="controles">


                <!-- Indicadores -->
                <div
                    class="paginas"
                    aria-label="Slide 1 de 3">

                    <span class="ativo"></span>

                    <span></span>

                    <span></span>

                </div>


                <!-- Botão próximo -->
                <button
                    class="proximo"
                    type="button"
                    onclick="proximoSlide()"
                    aria-label="Próximo slide">

                    →

                </button>

            </div>

        </main>

    </section>

</html>
