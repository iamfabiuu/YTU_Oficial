            <!-- CONTROLES -->
            <div class="controles">

                <div
                    class="paginas"
                    aria-label="Slide 1 de 3">

                <!-- BOTÃO PRÓXIMO -->

                    class="proximo"
                    type="button"
                    onclick="proximoSlide()"
                    aria-label="Próximo slide">

                    →
                    
                </button>

            </div>

        </main>

    </section>
